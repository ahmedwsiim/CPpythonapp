<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal Flask App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">Minimal Flask App</a>
      </div>
    </nav>
    <div class="container">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Echo API</h5>
          <p class="card-text">Type a message and click <strong>Send</strong> to call the sample API.</p>
          <div class="mb-3">
            <input id="msg" class="form-control" placeholder="Your message" />
          </div>
          <button id="send" class="btn btn-primary">Send</button>
          <pre id="result" class="mt-3 p-3 bg-light border"></pre>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('send').onclick = async () => {
        const msg = encodeURIComponent(document.getElementById('msg').value || 'hello')
        const res = await fetch(`/api/echo?msg=${msg}`)
        const data = await res.json()
        document.getElementById('result').textContent = JSON.stringify(data, null, 2)
      }
    </script>
  </body>
</html>
