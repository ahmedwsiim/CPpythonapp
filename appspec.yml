version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/sysmon-app
hooks:
  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 300
      runas: ubuntu
  BeforeInstall:
    - location: scripts/install_os_deps.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/install_python_deps.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 300
      runas: ubuntu
